name: Publish Extension

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run compile

      - name: Determine next version
        id: version
        run: |
          # Get the latest published version from the marketplace
          PUBLISHED=$(npx @vscode/vsce show wolfskii.keepr --json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).versions[0].version" 2>/dev/null || echo "")
          LOCAL=$(node -p "require('./package.json').version")

          # Use whichever is higher as the base
          BASE=$(node -e "
            const semver = (v) => v.split('.').map(Number);
            const pub = '${PUBLISHED}' ? semver('${PUBLISHED}') : [0,0,0];
            const loc = semver('${LOCAL}');
            const higher = (pub[0] > loc[0] || (pub[0] === loc[0] && pub[1] > loc[1]) || (pub[0] === loc[0] && pub[1] === loc[1] && pub[2] > loc[2])) ? '${PUBLISHED}' : '${LOCAL}';
            console.log(higher);
          ")

          # Bump patch from the higher base
          NEXT=$(node -e "
            const [M, m, p] = '${BASE}'.split('.').map(Number);
            console.log(M + '.' + m + '.' + (p + 1));
          ")

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Published: ${PUBLISHED:-none}, Local: $LOCAL, Base: $BASE, Next: $NEXT"

      - name: Set version in package.json
        run: npm version ${{ steps.version.outputs.next }} --no-git-tag-version --allow-same-version

      - name: Update README version badge from release version
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          node -e "const fs=require('fs');const v=process.env.VERSION;const badge='https://img.shields.io/badge/VS%20Code%20Marketplace-v'+v+'-007ACC?logo=visualstudiocode&logoColor=white';const re=/https:\/\/(?:vsmarketplacebadges\.dev\/version-short\/wolfskii\.keepr\.svg(?:\?[^\"<>]*)?|img\.shields\.io\/badge\/VS%20Code%20Marketplace-[^\"<>]+)/g;const p='README.md';let s=fs.readFileSync(p,'utf8');s=s.replace(re,badge);fs.writeFileSync(p,s);"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md
          git commit -m "chore: bump version to ${{ steps.version.outputs.next }}" || echo "No changes to commit"
          git push

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --no-git-tag-version -p ${{ secrets.PUBLISHING_PAT }}
        env:
          VSCE_PAT: ${{ secrets.PUBLISHING_PAT }}

      - name: Create and push git tag
        run: |
          TAG="v${{ steps.version.outputs.next }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.next }}
          name: v${{ steps.version.outputs.next }}
          generate_release_notes: true
