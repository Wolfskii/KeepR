name: Publish Extension

on:
  push:
    branches: [develop]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run compile

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish patch --no-git-tag-version -p ${{ secrets.PUBLISHING_PAT }}
        env:
          VSCE_PAT: ${{ secrets.PUBLISHING_PAT }}
